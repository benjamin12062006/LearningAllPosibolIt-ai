name: estadistica-forms-ai

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: estadistica-forms-qdrant
    restart: unless-stopped
    cpus: 2
    mem_limit: 1g
    ports:
      - "127.0.0.1:56333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
    external: true
    name: estadistica-forms-qdrant-data
